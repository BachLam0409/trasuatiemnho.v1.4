function morph(a,html){const t=document.createElement('template');t.innerHTML=html;sync(a,t.content)}
function sync(o,n){const nc=n.childNodes;for(let i=0;i<nc.length;i++){const a=o.childNodes[i],b=nc[i];
 if(!a){o.appendChild(b.cloneNode(true));continue}
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){o.replaceChild(b.cloneNode(true),a);continue}
 if(b.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;continue}
 if(a.isEqualNode(b))continue;
 for(let k=a.attributes.length-1;k>=0;k--){const nm=a.attributes[k].name;if(!b.hasAttribute(nm)&&!(nm==='open'&&a.nodeName==='DETAILS'))a.removeAttribute(nm)}
 for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 sync(a,b)}
 while(o.childNodes.length>nc.length)o.removeChild(o.lastChild)}

function importSave(el){const file=el.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),data=parsed.save||parsed;if(!data||typeof data.day!=='number'||!Array.isArray(data.dS)||!Array.isArray(data.eq))throw Error('Sai cấu trúc file');if(!confirm('Khôi phục bản này sẽ thay tiến trình trên thiết bị hiện tại. Tiếp tục?'))return;S={...fresh(),...data,scr:'game',ph:data.ph==='play'?'prep':data.ph,tab:'shop'};had=1;save();draw();toast('Đã khôi phục tiến trình')}catch(e){toast('File không hợp lệ: '+e.message,1)}};reader.readAsText(file)}
function storeCloudCfg(){cloudCfg={url:document.getElementById('cloudUrl').value.trim().replace(/\/$/,''),key:document.getElementById('cloudKey').value.trim()};localStorage.setItem('ttp_cloud_cfg',JSON.stringify(cloudCfg));toast('Đã lưu cấu hình máy chủ')}
async function authCloud(signup){storeCloudCfg();const email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value;if(!cloudCfg.url||!cloudCfg.key||!email||!password)return toast('Điền URL, anon key, email và mật khẩu',1);try{const resp=await fetch(cloudCfg.url+'/auth/v1/'+(signup?'signup':'token?grant_type=password'),{method:'POST',headers:{'apikey':cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await resp.json();if(!resp.ok)throw Error(data.msg||data.error_description||data.message||'Lỗi đăng nhập');if(!data.access_token){toast('Đã đăng ký. Xác nhận email rồi đăng nhập.');return}cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+(data.expires_in||3600)*1000,user:data.user};localStorage.setItem('ttp_cloud_auth',JSON.stringify(cloudSession));draw();toast('Đã đăng nhập. Hãy tải bản đám mây trước khi chơi trên thiết bị mới')}catch(e){toast('Lỗi: '+e.message,1)}}
async function tokenCloud(){if(!cloudSession)return null;if(Date.now()<cloudSession.expires_at-60000)return cloudSession.access_token;const resp=await fetch(cloudCfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cloudCfg.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});const d=await resp.json();if(!resp.ok){cloudSession=null;localStorage.removeItem('ttp_cloud_auth');throw Error('Phiên hết hạn, vui lòng đăng nhập lại')}cloudSession={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user};localStorage.setItem('ttp_cloud_auth',JSON.stringify(cloudSession));return cloudSession.access_token}
async function cloudSync(dir,quiet=false){if(!cloudSession||cloudBusy)return;if(S.ph==='play')return toast('Chỉ đồng bộ khi đã ngừng bán hàng',1);cloudBusy=true;try{const token=await tokenCloud(),headers={apikey:cloudCfg.key,Authorization:'Bearer '+token,'Content-Type':'application/json'};let res;if(dir==='up'){const remote=await fetch(cloudCfg.url+'/rest/v1/game_saves?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&select=game_data,updated_at',{headers});if(remote.ok){const entries=await remote.json();if(entries.length&&Number(entries[0].game_data?.updatedAt||0)>Number(S.updatedAt||0)){if(quiet){console.warn('Bản đám mây mới hơn, bỏ qua tự ghi đè');return;}if(!confirm('Bản trên đám mây mới hơn! Vẫn ghi đè bằng bản trên máy này?'))return}}res=await fetch(cloudCfg.url+'/rest/v1/game_saves?on_conflict=user_id',{method:'POST',headers:{...headers,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:cloudSession.user.id,game_data:{...S,scr:'game',ph:S.ph==='play'?'prep':S.ph}})});if(!res.ok)throw Error((await res.text()).slice(0,170));if(!quiet)toast('☁️ Đã lưu lên đám mây')}else{res=await fetch(cloudCfg.url+'/rest/v1/game_saves?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&select=game_data,updated_at',{headers});if(!res.ok)throw Error((await res.text()).slice(0,170));const rows=await res.json();if(!rows.length)return toast('Chưa có dữ liệu trên đám mây',1);if(!confirm('Tải bản lưu '+new Date(rows[0].updated_at).toLocaleString('vi-VN')+'? Tiến trình trên máy này sẽ bị thay thế.'))return;S={...fresh(),...rows[0].game_data,scr:'game',ph:rows[0].game_data.ph==='play'?'prep':rows[0].game_data.ph,tab:'shop'};had=1;save();draw();toast('Đã tải tiến trình từ đám mây')}}catch(e){if(!quiet)toast('Đồng bộ lỗi: '+e.message,1);console.warn('Cloud sync',e)}finally{cloudBusy=false}}
function scheduleCloud(){if(!cloudSession||S.ph==='play')return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSync('up',true),1800)}
function cloudLogout(){cloudSession=null;localStorage.removeItem('ttp_cloud_auth');draw();toast('Đã đăng xuất tài khoản đám mây')}
function backupH(){return `<div class=backup-wrap><div class=bn style="background:#dbe8ff"><span>☁️</span>Sao lưu & chơi trên nhiều thiết bị</div><div class=cd><h2>💾 Sao lưu file – dùng ngay, không cần tài khoản</h2><p>Tải file JSON về máy hoặc chọn một file đã lưu để khôi phục tiến trình.</p><div class=ch><button onclick="downloadSave()">⬇️ Xuất bản sao lưu</button><label style="display:inline-block;cursor:pointer;padding:9px;background:#e5eff7;border-radius:9px">⬆️ Nhập bản sao lưu<input type=file accept=".json,application/json" onchange="importSave(this)" style="display:none"></label></div></div><div class=cd><h2>🌐 Đồng bộ tài khoản nhiều thiết bị (Supabase)</h2><small>Thiết lập miễn phí một dự án Supabase và tạo bảng game_saves theo hướng dẫn bên dưới. Dùng cùng URL, public anon key và email trên các thiết bị. Không đưa service_role key vào trò chơi.</small><div class=rw><b>Project URL</b></div><input id=cloudUrl placeholder="https://...supabase.co" value="${cloudCfg.url||''}"><div class=rw><b>Publishable / anon key</b></div><input id=cloudKey placeholder="sb_publishable_... hoặc anon key" value="${cloudCfg.key||''}"><div class=rw><b>Email</b></div><input id=cloudEmail type=email placeholder="email@example.com" value="${cloudSession?.user?.email||''}"><div class=rw><b>Mật khẩu</b></div><input id=cloudPassword type=password placeholder="Mật khẩu tài khoản"><div class=ch style="margin-top:10px"><button onclick="authCloud(false)">🔐 Đăng nhập</button><button onclick="authCloud(true)">➕ Đăng ký</button>${cloudSession?'<button onclick="cloudLogout()">Đăng xuất</button>':''}</div><p><small>Trạng thái: ${cloudSession?'✅ Đã đăng nhập '+cloudSession.user.email:'⚪ Chưa đăng nhập'}</small></p><div class=ch><button onclick="cloudSync('up')" ${!cloudSession?'disabled':''}>☁️ Đẩy bản lưu lên</button><button onclick="cloudSync('down')" ${!cloudSession?'disabled':''}>📥 Tải bản lưu về thiết bị</button></div><small>Khi đăng nhập, dữ liệu cũng tự đẩy lên sau các thay đổi ngoài ca bán. Ở thiết bị khác, đăng nhập rồi bấm “Tải bản lưu về thiết bị”.</small></div><div class=cd><h2>🛠️ SQL tạo bảng trên Supabase (chỉ làm một lần)</h2><pre style="white-space:pre-wrap;font-size:11px;user-select:text;background:#f4f6f8;color:#233;padding:10px;border-radius:10px">create table public.game_saves (user_id uuid primary key references auth.users(id) on delete cascade, game_data jsonb not null, updated_at timestamptz default now());
alter table public.game_saves enable row level security;
create policy "owner_select" on public.game_saves for select to authenticated using ((select auth.uid()) = user_id);
create policy "owner_insert" on public.game_saves for insert to authenticated with check ((select auth.uid()) = user_id);
create policy "owner_update" on public.game_saves for update to authenticated using ((select auth.uid()) = user_id) with check ((select auth.uid()) = user_id);</pre><small>Để thời gian cập nhật chính xác, có thể tạo trigger cập nhật updated_at. Không dùng hai thiết bị chơi cùng lúc để tránh ghi đè bản lưu.</small></div></div>`}

const PET_MAX=4,PET_DAY=5;
const petOwn=()=>(S.pets||[]).map(id=>PETS.find(p=>p[0]===id)).filter(Boolean),
petMul=()=>1+Math.min(.15,petOwn().reduce((a,p)=>a+p[6],0)/100),

function petArt(p,x,y,s){const L=p[5],cat=p[2]=='cat',f=L.f,d=L.d||f,m=L.m||f,ey=L.ey||'#3a2a35',ln='#7a4c55',by=L.sl?-6:-10,bh=L.sl?5.5:8.5;let back='',front='',fz='';
const t=L.t;
if(t=='cat')back=`<path d="M-10 -31l-2-13 9 6zM10 -31l2-13-9 6z" fill="${d}"/><path d="M-9.5 -34l-1-6 4 3zM9.5 -34l1-6-4 3z" fill="#ffb3c9" stroke="none"/>`;
else if(t=='up')back=`<path d="M-11 -30l-3-17 11 9zM11 -30l3-17-11 9z" fill="${f}"/><path d="M-10 -34l-1.5-9 5 4zM10 -34l1.5-9-5 4z" fill="#ffc9d6" stroke="none"/>`;
else if(t=='fox')back=`<path d="M-9 -32l-1-11 8 6zM9 -32l1-11-8 6z" fill="${f}"/>`;
else if(t=='drop')back=`<ellipse cx="-11" cy="-24" rx="4" ry="7" fill="${d}" transform="rotate(12 -11 -24)"/><ellipse cx="11" cy="-24" rx="4" ry="7" fill="${d}" transform="rotate(-12 11 -24)"/>`;
else if(t=='long')back=`<path d="M-8 -33q-9 3-8 19q3 3 6-2zM8 -33q9 3 8 19q-3 3-6-2z" fill="${d}"/>`;
else if(t=='puff')back=`<circle cx="-12" cy="-25" r="5.5" fill="${f}"/><circle cx="12" cy="-25" r="5.5" fill="${f}"/><circle cx="0" cy="-39" r="6" fill="${f}"/><circle cx="-5.5" cy="-36" r="4" fill="${f}"/><circle cx="5.5" cy="-36" r="4" fill="${f}"/>`;
else if(t=='fold')front=`<ellipse cx="-8" cy="-35" rx="4.2" ry="2.6" fill="${d}" transform="rotate(-22 -8 -35)"/><ellipse cx="8" cy="-35" rx="4.2" ry="2.6" fill="${d}" transform="rotate(22 8 -35)"/>`;
if(L.fl){for(let i=0;i<10;i++){const a=i/10*6.283;fz+=`<circle cx="${(Math.cos(a)*11.5).toFixed(1)}" cy="${(-26+Math.sin(a)*10.5).toFixed(1)}" r="3.7" fill="${f}"/>`}}
const tail=cat?`<path d="M10 ${by+1}q15 0 11-17" fill="none" stroke="${ln}" stroke-width="5.4"/><path d="M10 ${by+1}q15 0 11-17" fill="none" stroke="${d}" stroke-width="3.4"/>`:(L.fl?`<circle cx="13" cy="-14" r="6" fill="${f}"/>`:`<path d="M11 -12q9-3 6-13" fill="none" stroke="${ln}" stroke-width="4.8"/><path d="M11 -12q9-3 6-13" fill="none" stroke="${f}" stroke-width="3"/>`);
const ex=L.fc?-24.5:-27,eye=(cx)=>`<ellipse cx="${cx}" cy="${ex}" rx="2.1" ry="2.7" fill="${ey}" stroke="none"/>${cat&&L.ey?`<ellipse cx="${cx}" cy="${ex}" rx=".9" ry="2" fill="#2d2330" stroke="none"/>`:''}<circle cx="${cx+.7}" cy="${ex-1}" r=".8" fill="#fff" stroke="none"/>`;

function buyPet(id){const p=PETS.find(x=>x[0]===id);if(!p||!canManage()||S.day<PET_DAY||(S.pets||[]).includes(id)||(S.pets||[]).length>=PET_MAX||S.cash<p[3])return;S.cash-=p[3];(S.pets=S.pets||[]).push(id);logEv('Nhận nuôi '+p[1]);save();keep();toast('🐾 Đã đón '+p[1]+' về quán')}

(function(){const L=document.querySelector('link[rel=manifest]');if(!L||location.protocol.indexOf('http')!==0)return;
 fetch(L.href,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>{const base=location.href.replace(/[^\/]*$/,'');

  L.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))})})();
const pwInApp=()=>/FBAN|FBAV|FB_IAB|Messenger|Zalo|Instagram|Line\/|TikTok|MicroMessenger/i.test(navigator.userAgent);
const PW={ev:null,gone:0};
